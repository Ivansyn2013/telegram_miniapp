name: Deploy Mini App

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy front files to root
        run: |
          cp -r front/* ./
          # Копируем .nojekyll, если нужен
          touch .nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PERSONAL_GH_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          commit_message: ${{ format('Deploy from {0}', github.sha) }}
